[project]
name = "chemq-assist"
version = "0.1.0"
description = "ChemQ Assist research and software scaffold"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pandas>=2.2",
  "polars>=1.0",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "duckdb>=1.0",
  "jinja2>=3.1",
  "markdown>=3.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "jupyter>=1.0"
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
